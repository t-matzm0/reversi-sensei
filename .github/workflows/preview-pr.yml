name: Deploy PR Preview

on:
  pull_request:
    branches: [develop]

env:
  NODE_VERSION: '20'

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Build for Firebase
        run: npm run build:firebase:staging
        env:
          BUILD_TARGET: firebase
          NEXT_PUBLIC_ENV: staging
          NEXT_PUBLIC_STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Preview Channel
        id: deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > $HOME/gcloud-service-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud-service-key.json
          firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} --expires 7d --target staging --json 2>&1 | tee deploy-output.json
          echo "=== Raw Deploy Output ==="
          cat deploy-output.json
          echo ""
          echo "=== Attempting URL extraction ==="
          # Try multiple extraction methods
          PREVIEW_URL=$(cat deploy-output.json | jq -r '.result["reversi-sensei-dev"].url // empty' 2>/dev/null)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(cat deploy-output.json | jq -r '.result | to_entries[0].value.url // empty' 2>/dev/null)
          fi
          if [ -z "$PREVIEW_URL" ]; then
            # Try to extract URL with grep as fallback
            PREVIEW_URL=$(grep -oP 'https://[^"]+\.web\.app' deploy-output.json | head -1)
          fi
          echo "PREVIEW_URL=$PREVIEW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_ENV
          # Save raw output for debugging in PR comment
          echo "DEPLOY_OUTPUT<<EOF" >> $GITHUB_ENV
          head -c 500 deploy-output.json >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const rawOutput = process.env.DEPLOY_OUTPUT || 'No output captured';
            let body;
            if (url) {
              body = `🚀 Preview deployment ready!\n\n**Preview URL:** ${url}\n\nThis preview will expire in 7 days.`;
            } else {
              body = `⚠️ Preview deployment completed but URL extraction failed.\n\n<details>\n<summary>Debug: Raw deploy output (first 500 chars)</summary>\n\n\`\`\`\n${rawOutput}\n\`\`\`\n</details>`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
